description: 82 Labs, Inc. (doing business as More Labs) is a Los Angeles-based, science-backed
  wellness beverage company founded in 2016 by former Tesla engineer Sisun Lee. More Labs makes
  functional drink supplements sold direct-to-consumer, including Morning Recovery (hydration and
  post-alcohol recovery with electrolytes and DHM), Liquid Focus (a nootropic caffeine energy shot),
  and Dream Well (a melatonin and lemon-balm sleep aid). It is a consumer packaged goods (CPG) and
  e-commerce business with no public developer API, developer portal, SDKs, or machine-readable API
  artifacts; it was surfaced as a 500 Global portfolio company. Enrichment on 2026-07-17 confirmed no
  API surface exists to harvest.
